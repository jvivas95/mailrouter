[supervisord]
nodaemon=true
user=root
logfile=/var/www/storage/logs/supervisord.log
pidfile=/var/run/supervisord.pid

; ── Nginx ──────────────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── PHP-FPM ────────────────────────────────────────────────────────
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Queue Worker ────────────────────────────────────────────────────
; Process the jobs in the queue (ProcessInboxJob)
[program:queue-worker]
command=php /var/www/artisan queue:work --sleep=3 --tries=3 --timeout=120 --max-time=3600
autostart=true
autorestart=true
priority=20
user=www-data
numprocs=1
stdout_logfile=/var/www/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/storage/logs/worker-error.log
stderr_logfile_maxbytes=10MB

; ── Scheduler ───────────────────────────────────────────────────────
; Execute schedule:run every minute to dispatch ProcessInboxJob
[program:scheduler]
command=bash -c "while true; do php /var/www/artisan schedule:run >> /var/www/storage/logs/scheduler.log 2>&1; sleep 60; done"
autostart=true
autorestart=true
priority=20
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
